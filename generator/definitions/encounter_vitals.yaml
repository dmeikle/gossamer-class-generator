name: TaskProgramItem

table: task_program_items

project: medical.rehabilitation

fields:

  - name: id
    type: UUID
    required: true


  - name: taskId
    type: UUID
    required: true
    reference: Task


  - name: taskProgramId
    type: UUID
    required: true
    reference: TaskProgram

  - name: sortOrder
    type: Integer
    default: 0

  - name: createdAt
    type: Instant
    required: true

  - name: deletedAt
    type: Instant
