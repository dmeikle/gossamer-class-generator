name: EncounterNoteTemplate

table: encounter_note_templates

project: medical.clinical

fields:
  - name: id
    type: UUID
    required: true

  - name: organizationId
    type: UUID
    required: true
    reference: Organization

  - name: name
    type: String(200)
    required: true
    description: Display name of the template.

  - name: description
    type: Text
    required: false
    description: Optional description of the template.

  - name: category
    type: String(50)
    required: true
    description: Template category such as Follow-up or Initial Assessment.

  - name: specialty
    type: String(100)
    required: false
    description: Optional specialty the template is intended for.

  - name: content
    type: Text
    required: true
    description: Markdown or rich text template content.

  - name: isSystem
    type: Boolean
    required: true
    default: false
    description: Indicates whether this is a built-in system template.

  - name: isActive
    type: Boolean
    required: true
    default: true
    description: Indicates whether the template is available for use.

  - name: version
    type: Integer
    required: true
    default: 1
    description: Template version number.

  - name: createdBy
    type: UUID
    required: false
    reference: Provider
    description: Provider who created the template.

  - name: createdAt
    type: Timestamp
    required: true

  - name: updatedAt
    type: Timestamp
    required: true